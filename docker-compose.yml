services:
  api-gateway:
    build: ./apps/api-gateway
    depends_on:
      channel-microservice:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: "${API_GATEWAY_VAULT_TOKEN:-}"
    networks:
      - default
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", ping]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
      - default

  vault:
    image: hashicorp/vault:1.21.0
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
      - default

  fluentd:
    image: fluent/fluentd:v1.20.1-debian-1.1
    ports:
      # The logging driver connects from the Docker daemon, not the app network.
      - "127.0.0.1:24224:24224"
    volumes:
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
    logging:
      # Never forward the collector's own output back into itself.
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  channel-microservice:
    build:
      context: .
      dockerfile: apps/channel-microservice/Dockerfile
    depends_on:
      fluentd:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_started
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        tag: bizcord.channel
        fluentd-async: "true"
        fluentd-buffer-limit: "8192"
        fluentd-write-timeout: "1s"
        mode: non-blocking
        max-buffer-size: "1m"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: Development
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: "${VAULT_TOKEN:-}"
    networks:
      - backend

volumes:
  rabbitmq-data:
  vault-data:

networks:
  backend:
    name: bizcord-backend
    internal: true
